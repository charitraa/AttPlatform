# Production edge: TLS, the prebuilt SPA, and a reverse proxy to the ASGI backend.
# Production only (dev uses ../nginx/default.conf). Certificates are mounted at /etc/nginx/certs/{fullchain,privkey}.pem (see docs/deployment.md).
#
# proxy_set_header / add_header in a location REPLACE inherited directives, so the
# security headers live in one snippet that each serving location includes.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Re-resolve container names (Docker DNS) so recreating the backend never leaves a stale IP.
resolver 127.0.0.11 valid=10s ipv6=off;

limit_req_zone $binary_remote_addr zone=auth:10m rate=10r/m;   # credential endpoints, per IP
limit_req_zone $binary_remote_addr zone=api:10m  rate=20r/s;   # everything else, per IP

server {
    listen 80;
    server_name _;
    server_tokens off;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 25m;   # keep >= MAX_UPLOAD_SIZE_MB; Django enforces the exact limit

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    set $backend_upstream http://backend:8000;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # ---- backend (Django sets its own security headers, incl. HSTS) ----
    location ~ ^/api/v1/auth/(login|register|password)/ {
        limit_req zone=auth burst=5 nodelay;
        limit_req_status 429;
        proxy_pass $backend_upstream;
    }
    location /api/    { limit_req zone=api burst=40 nodelay; limit_req_status 429; proxy_pass $backend_upstream; proxy_read_timeout 60s; }
    location /ws/     { proxy_pass $backend_upstream; proxy_read_timeout 3600s; }
    location /admin/  { proxy_pass $backend_upstream; }
    location /static/ { proxy_pass $backend_upstream; expires 30d; }

    # Uploaded files are only ever served through authenticated API endpoints.
    location /media/ { return 404; }

    # ---- SPA ----
    root /usr/share/nginx/html;

    # Fingerprinted build output: cache for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Everything else is a client-side route: serve index.html, never cached.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri /index.html;
    }
}
