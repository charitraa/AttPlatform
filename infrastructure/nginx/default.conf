# Development reverse proxy: one origin for the SPA, API, WebSocket and admin.
# Production adds TLS and serves the prebuilt SPA (Phase 8).
#
# NOTE: nginx `proxy_set_header` / `add_header` in a location block REPLACE the
# inherited server-level directives. All proxy headers are therefore defined once
# here and never redefined inside locations.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      '';
}

# Resolve container names at request time (Docker's DNS), not once at start-up: otherwise
# recreating the backend container leaves nginx pointing at its old IP (502 until restart).
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;   # keep >= MAX_UPLOAD_SIZE_MB; Django enforces the exact limit
    server_tokens off;

    # Variables in proxy_pass make nginx use the resolver above (no URI part: paths pass through unchanged).
    set $backend_upstream  http://backend:8000;
    set $frontend_upstream http://frontend:5173;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    proxy_http_version 1.1;
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;
    proxy_set_header Upgrade           $http_upgrade;
    proxy_set_header Connection        $connection_upgrade;

    # Backend (Django sets its own security headers on these responses).
    location /api/    { proxy_pass $backend_upstream; proxy_read_timeout 60s; }
    location /admin/  { proxy_pass $backend_upstream; }
    location /static/ { proxy_pass $backend_upstream; }
    location /ws/     { proxy_pass $backend_upstream; proxy_read_timeout 3600s; }

    # Uploaded files are served through authenticated API endpoints (Phase 3), never directly.
    location /media/ { return 404; }

    # SPA (including the Vite HMR websocket).
    location / {
        proxy_pass $frontend_upstream;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "same-origin" always;
        add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;
    }
}
