# Development reverse proxy: one origin for the SPA, API, WebSocket and admin.
# Production adds TLS and serves the prebuilt SPA (Phase 8).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream backend  { server backend:8000; }
upstream frontend { server frontend:5173; }

server {
    listen 80;
    server_name _;

    client_max_body_size 25m;   # keep >= MAX_UPLOAD_SIZE_MB; Django enforces the exact limit
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Permissions-Policy "camera=(self), geolocation=(self), microphone=()" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID      $request_id;

    location /api/    { proxy_pass http://backend; proxy_read_timeout 60s; }
    location /admin/  { proxy_pass http://backend; }
    location /static/ { proxy_pass http://backend; }

    location /ws/ {
        proxy_pass http://backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }

    # Uploaded files are served through authenticated API endpoints (Phase 3), never directly.
    location /media/ { return 404; }

    # SPA, including the Vite HMR websocket.
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
    }
}
